name: CI/CD

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci-cd.yml"
  push:
    branches:
      - "main"
    paths:
      - "app/**"
      - ".github/workflows/ci-cd.yml"

permissions:
  contents: read

concurrency:
  group: finance-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 驗證應用程式、功能流程與 Workers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check:workers

  browsers:
    name: 瀏覽器相容性（${{ matrix.project }}）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, engine: chromium }
          - { project: firefox, engine: firefox }
          - { project: webkit, engine: webkit }
          - { project: mobile-chromium, engine: chromium }
          - { project: mobile-webkit, engine: webkit }
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: 安裝瀏覽器測試環境
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: 執行端對端功能驗證
        run: npm run test:e2e -- ${{ matrix.project }}
      - name: 保存失敗的介面測試追蹤
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-traces-${{ matrix.project }}
          path: app/test-results/
          retention-days: 7

  deploy-production:
    name: 部署正式環境
    needs: [verify, browsers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: 套用 D1 migrations
        run: npm run db:d1:migrate:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 部署 Worker
        run: npm run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
